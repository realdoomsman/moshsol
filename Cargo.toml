[workspace]
members = ["programs/*", "tests/program"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Size-optimized: program rent on devnet/mainnet scales with the .so size.
opt-level = "s"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
